name: Build Hyperbit AVIF APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK 36 & Build-Tools 36.0.0
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generate Android Project Structure & Source Code
        run: |
          mkdir -p app/src/main/java/com/hyperbit/avif
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "HyperbitAVIF"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.9.1' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=false
          android.nonTransitiveRClass=true
          EOF

          keytool -genkeypair -v \
            -keystore app/hyperbit-release.jks \
            -alias hyperbit \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass hyperbit123 -keypass hyperbit123 \
            -dname "CN=Hyperbit AVIF, OU=Studio, O=Hyperbit, L=Bandung, S=West Java, C=ID"

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.hyperbit.avif'
              compileSdk 36
              buildToolsVersion "36.0.0"

              defaultConfig {
                  applicationId "com.hyperbit.avif"
                  minSdk 28
                  targetSdk 35
                  versionCode 248
                  versionName "2.4.8-native"
              }

              signingConfigs {
                  release {
                      storeFile file("hyperbit-release.jks")
                      storePassword "hyperbit123"
                      keyAlias "hyperbit"
                      keyPassword "hyperbit123"
                      enableV1Signing true
                      enableV2Signing true
                      enableV3Signing true
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }

              packaging {
                  jniLibs {
                      useLegacyPackaging true
                  }
              }
          }

          configurations.all {
              resolutionStrategy {
                  force 'androidx.annotation:annotation:1.9.1'
                  force 'androidx.annotation:annotation-jvm:1.9.1'
              }
          }

          dependencies {
              implementation platform('org.jetbrains.kotlin:kotlin-bom:2.1.0')
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
              implementation 'androidx.exifinterface:exifinterface:1.3.7'
              implementation 'io.github.awxkee:avif-coder:2.2.1'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Hyperbit AVIF"
                  android:largeHeap="true"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.HyperbitAVIF">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.HyperbitAVIF" parent="Theme.MaterialComponents.NoActionBar">
                  <item name="colorPrimary">#6366F1</item>
                  <item name="colorPrimaryVariant">#4F46E5</item>
                  <item name="colorSecondary">#10B981</item>
                  <item name="android:windowBackground">#0B0F19</item>
                  <item name="android:statusBarColor">#0B0F19</item>
                  <item name="android:navigationBarColor">#0B0F19</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#0F172A"
                  android:pathData="M0,0h108v108h-108z" />
              <path
                  android:fillColor="#4F46E5"
                  android:pathData="M14,14h80v80h-80z" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#10B981"
                  android:pathData="M34,30h12v18h16v-18h12v48h-12v-18h-16v18h-12z" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/card_bg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#111827" />
              <stroke android:width="1dp" android:color="#1F2937" />
              <corners android:radius="12dp" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/btn_primary.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <gradient android:startColor="#6366F1" android:endColor="#10B981" android:angle="0" />
              <corners android:radius="10dp" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/btn_secondary.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#1E293B" />
              <stroke android:width="1dp" android:color="#334155" />
              <corners android:radius="10dp" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#0B0F19"
              android:fillViewport="true">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:padding="14dp">

                  <!-- Header -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:background="@drawable/card_bg"
                      android:gravity="center_vertical"
                      android:orientation="horizontal"
                      android:padding="12dp">

                      <LinearLayout
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:orientation="vertical">

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="HYPERBIT AVIF STUDIO"
                              android:textColor="#F8FAFC"
                              android:textSize="17sp"
                              android:textStyle="bold" />

                          <TextView
                              android:id="@+id/tvSubtitle"
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="Native AV1 / libavif Encoder • v2.4.8"
                              android:textColor="#34D399"
                              android:textSize="11sp" />
                      </LinearLayout>

                      <TextView
                          android:id="@+id/tvCoreBadge"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:background="#1E293B"
                          android:paddingLeft="10dp"
                          android:paddingTop="5dp"
                          android:paddingRight="10dp"
                          android:paddingBottom="5dp"
                          android:text="8 CORES"
                          android:textColor="#93C5FD"
                          android:textSize="11sp"
                          android:textStyle="bold" />
                  </LinearLayout>

                  <!-- Real-Time CPU & RAM Monitor -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="10dp"
                      android:background="@drawable/card_bg"
                      android:orientation="vertical"
                      android:padding="12dp">

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="horizontal">
