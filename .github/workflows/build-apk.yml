name: Build Hyperbit AVIF Android APK (1-to-1 Native Port)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK 26 & CMake
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
          sudo apt-get update && sudo apt-get install -y ninja-build nasm

      - name: Build Native libavif (avifenc & avifdec) for Android ARM64 & x86_64
        run: |
          NDK_DIR="$ANDROID_HOME/ndk/26.1.10909125"
          git clone --depth 1 --branch v1.1.1 https://github.com/AOMediaCodec/libavif.git /tmp/libavif
          for ABI in arm64-v8a x86_64; do
            echo "=== Building libavif for $ABI ==="
            cmake -S /tmp/libavif -B /tmp/build_$ABI -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$NDK_DIR/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=$ABI \
              -DANDROID_PLATFORM=android-24 \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=OFF \
              -DAVIF_CODEC_AOM=LOCAL \
              -DAVIF_LIBYUV=LOCAL \
              -DAVIF_BUILD_APPS=ON \
              -DAVIF_BUILD_TESTS=OFF
            cmake --build /tmp/build_$ABI --target avifenc avifdec -j$(nproc)
            mkdir -p app/src/main/jniLibs/$ABI
            cp /tmp/build_$ABI/avifenc app/src/main/jniLibs/$ABI/libavifenc.so
            cp /tmp/build_$ABI/avifdec app/src/main/jniLibs/$ABI/libavifdec.so
            chmod 755 app/src/main/jniLibs/$ABI/*.so
          done

      - name: Generate 1-to-1 Android Project Structure & Gradle Files
        run: |
          mkdir -p app/src/main/java/id/hyperbit/avif
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/xml

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "HyperbitAVIF"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'id.hyperbit.avif'
              compileSdk 34

              defaultConfig {
                  applicationId "id.hyperbit.avif"
                  minSdk 24
                  targetSdk 34
                  versionCode 240
                  versionName "2.4.0-android"
                  ndk {
                      abiFilters 'arm64-v8a', 'x86_64'
                  }
              }

              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
                  debug {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.documentfile:documentfile:1.0.1'
              implementation 'androidx.exifinterface:exifinterface:1.3.7'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Hyperbit AVIF</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.HyperbitAVIF" parent="Theme.Material3.Dark.NoActionBar">
                  <item name="colorPrimary">#4F46E5</item>
                  <item name="colorSecondary">#10B981</item>
                  <item name="android:statusBarColor">#0F172A</item>
                  <item name="android:navigationBarColor">#020617</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <cache-path name="cache" path="." />
              <files-path name="files" path="." />
              <external-path name="external" path="." />
          </paths>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:largeHeap="true"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.HyperbitAVIF">

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="image/*" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.SEND_MULTIPLE" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="image/*" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Generate Launcher Icon (Custom or Default HB)
        run: |
          python3 - << 'PYEOF'
          import base64, os
          b64 = "__CUSTOM_ICON_BASE64__"
          out_path = "app/src/main/res/mipmap-xxxhdpi/ic_launcher.png"
          if b64 != "__CUSTOM_ICON_BASE64__" and len(b64) > 64:
              with open(out_path, "wb") as f:
                  f.write(base64.b64decode(b64))
          else:
              # Minimal crisp 256x256 PNG generator using zlib/struct (no extra pip deps)
              import zlib, struct
              w, h = 256, 256
              raw = bytearray()
              for y in range(h):
                  raw.append(0)
                  for x in range(w):
                      t = (x + y) / (w + h)
                      r = int(79 * (1 - t) + 16 * t)
                      g = int(70 * (1 - t) + 185 * t)
                      b = int(229 * (1 - t) + 129 * t)
                      raw.extend([r, g, b, 255])
              def chunk(tag, data):
                  return struct.pack("!I", len(data)) + tag + data + struct.pack("!I", zlib.crc32(tag + data) & 0xffffffff)
              png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack("!IIBBBBB", w, h, 8, 6, 0, 0, 0)) + chunk(b"IDAT", zlib.compress(bytes(raw), 9)) + chunk(b"IEND", b"")
              with open(out_path, "wb") as f:
                  f.write(png)
          PYEOF

      - name: Generate 1-to-1 Kotlin Engine, Integrity Guard & UI Source
        run: |
          cat << 'EOF' > app/src/main/java/id/hyperbit/avif/Models.kt
          package id.hyperbit.avif

          import android.graphics.Bitmap
          import android.net.Uri
          import kotlinx.coroutines.Job
          import java.util.Locale

          data class CropRect(
              val sx: Int,
              val sy: Int,
              val sw: Int,
              val sh: Int,
              val dw: Int,
              val dh: Int
          )

          data class QueueItem(
              val id: String,
              val sourceUri: Uri,
              val origName: String,
              var baseName: String,
              val origExt: String,
              val category: String,
              val origSize: Long,
              val origWidth: Int,
              val origHeight: Int,
              val thumbnail: Bitmap?,
              var status: String = "ready",
              var statusDetail: String = "",
              var progress: Int = 0,
              var estimateText: String = "",
              var estimateSmaller: Boolean = true,
              var outputUri: Uri? = null,
              var outputFilePath: String = "",
              var outputDisplayName: String = "",
              var resultSize: Long = 0L,
              var resultWidth: Int = 0,
              var resultHeight: Int = 0,
              var elapsedSec: Double = 0.0,
              var job: Job? = null,
              var activeProcess: Process? = null
          ) {
              fun metaText(): String {
                  val mp = (origWidth * origHeight) / 1_000_000.0
                  return String.format(Locale.US, "%s  |  %s  |  %dx%dpx (%.1f MP)",
                      origExt, AppHelpers.formatBytes(origSize), origWidth, origHeight, mp)
              }

              fun statusText(): String {
                  return when (status) {
                      "processing" -> "Memproses... $progress%"
                      "done" -> {
                          val diff = if (origSize > 0) (((resultSize.toDouble() - origSize) / origSize) * 100.0) else 0.0
                          val sign = if (diff <= 0) String.format(Locale.US, "%.0f%%", diff) else String.format(Locale.US, "+%.0f%%", diff)
                          String.format(Locale.US, "Selesai: %s (%s) | %dx%dpx | %.2f dtk",
                              AppHelpers.formatBytes(resultSize), sign, resultWidth, resultHeight, elapsedSec)
                      }
                      "stopped" -> "Dihentikan Pengguna"
                      "error" -> "Gagal: ${statusDetail.ifEmpty { "Error" }}"
                      else -> "Siap Dikonversi"
                  }
              }
          }

          object AppHelpers {
              fun formatBytes(bytes: Long): String {
                  if (bytes <= 0L) return "0 B"
                  val units = arrayOf("B", "KB", "MB", "GB")
                  var idx = 0
                  var v = bytes.toDouble()
                  while (v >= 1024.0 && idx < units.size - 1) {
                      v /= 1024.0
                      idx++
                  }
                  return String.format(Locale.US, "%.2f %s", v, units[idx])
              }

              fun isSupportedImageName(name: String): Boolean {
                  val lower = name.lowercase(Locale.US)
                  return lower.endsWith(".jpg") || lower.endsWith(".jpeg") || lower.endsWith(".png") ||
                         lower.endsWith(".webp") || lower.endsWith(".heic") || lower.endsWith(".heif") ||
                         lower.endsWith(".bmp") || lower.endsWith(".gif") || lower.endsWith(".ico")
              }

              fun getSourceCategory(ext: String): String {
                  return when (ext.uppercase(Locale.US).trimStart('.')) {
                      "JPG", "JPEG" -> "JPG"
                      "PNG" -> "PNG"
                      "WEBP" -> "WEBP"
                      "HEIC", "HEIF" -> "HEIC"
                      else -> "OTHER"
                  }
              }

              fun calculateCropAndSize(
                  origW: Int, origH: Int, modeIdx: Int, maxPx: Int,
                  ratioIdx: Int, scalePct: Int, custW: Int, custH: Int, lockAspect: Boolean
              ): CropRect {
                  val w = maxOf(1, origW)
                  val h = maxOf(1, origH)
                  if (modeIdx == 1) return CropRect(0, 0, w, h, w, h)
                  if (modeIdx == 2) {
                      val f = maxOf(1, scalePct) / 100.0
                      return CropRect(0, 0, w, h, maxOf(1, Math.round(w * f).toInt()), maxOf(1, Math.round(h * f).toInt()))
                  }
                  if (modeIdx == 3) {
                      val dw = maxOf(10, custW)
                      val dh = if (lockAspect) maxOf(1, Math.round(dw / (w.toDouble() / h)).toInt()) else maxOf(10, custH)
                      return CropRect(0, 0, w, h, dw, dh)
                  }
                  val targetRatio = when (ratioIdx) {
                      1 -> 16.0 / 9.0
                      2 -> 9.0 / 16.0
                      3 -> 4.0 / 3.0
                      4 -> 1.0
                      else -> 0.0
                  }
                  var sx = 0
                  var sy = 0
                  var sw = w
                  var sh = h
                  if (targetRatio > 0.0) {
                      val srcRatio = w.toDouble() / h
                      if (srcRatio > targetRatio) {
                          sw = Math.round(h * targetRatio).toInt()
                          sx = (w - sw) / 2
                      } else if (srcRatio < targetRatio) {
                          sh = Math.round(w / targetRatio).toInt()
                          sy = (h - sh) / 2
                      }
                  }
                  val longest = maxOf(sw, sh)
                  val scale = if (longest > maxPx) (maxPx.toDouble() / longest) else 1.0
                  val dw = maxOf(1, Math.round(sw * scale).toInt())
                  val dh = maxOf(1, Math.round(sh * scale).toInt())
                  return CropRect(sx, sy, sw, sh, dw, dh)
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/id/hyperbit/avif/ImageEngine.kt
          package id.hyperbit.avif

          import android.content.ContentValues
          import android.content.Context
          import android.graphics.*
          import android.net.Uri
          import android.os.Build
          import android.os.Environment
          import android.provider.MediaStore
          import androidx.documentfile.provider.DocumentFile
          import androidx.exifinterface.media.ExifInterface
          import java.io.File
          import java.io.FileInputStream
          import java.io.FileOutputStream
          import java.util.Locale
          import java.util.UUID

          class ImageEngine(private val context: Context) {
              val avifEncPath: String
              val avifDecPath: String

              init {
                  val nativeDir = context.applicationInfo.nativeLibraryDir
                  val enc = File(nativeDir, "libavifenc.so")
                  val dec = File(nativeDir, "libavifdec.so")
                  avifEncPath = if (enc.exists()) enc.absolutePath else ""
                  avifDecPath = if (dec.exists()) dec.absolutePath else ""
              }

              fun decodeNormalizedBitmap(uri: Uri): Bitmap {
                  val ext = getExtensionFromUri(uri).lowercase(Locale.US)
                  if (ext == "avif" && avifDecPath.isNotEmpty()) {
                      val tmpIn = File(context.cacheDir, "dec_in_${UUID.randomUUID()}.avif")
                      val tmpPng = File(context.cacheDir, "dec_out_${UUID.randomUUID()}.png")
                      try {
                          context.contentResolver.openInputStream(uri)?.use { input ->
                              FileOutputStream(tmpIn).use { output -> input.copyTo(output) }
                          }
                          val pb = ProcessBuilder(avifDecPath, tmpIn.absolutePath, tmpPng.absolutePath)
                          pb.redirectErrorStream(true)
                          val p = pb.start()
                          p.waitFor()
                          if (tmpPng.exists()) {
                              return BitmapFactory.decodeFile(tmpPng.absolutePath)
                                  ?: throw IllegalStateException("Gagal mendekode AVIF")
                          }
                      } finally {
                          tmpIn.delete()
                          tmpPng.delete()
                      }
                  }

                  var orientation = ExifInterface.ORIENTATION_NORMAL
                  context.contentResolver.openInputStream(uri)?.use { exifStream ->
                      try {
                          val exif = ExifInterface(exifStream)
                          orientation = exif.getAttributeInt(ExifInterface.TAG_ORIENTATION, ExifInterface.ORIENTATION_NORMAL)
                      } catch (_: Exception) {}
                  }

                  val raw = context.contentResolver.openInputStream(uri)?.use {
                      BitmapFactory.decodeStream(it)
                  } ?: throw IllegalStateException("File gambar tidak dapat dibaca")

                  return applyExifRotation(raw, orientation)
              }

              fun decodeFileNormalized(file: File): Bitmap {
                  return decodeNormalizedBitmap(Uri.fromFile(file))
              }

              private fun getExtensionFromUri(uri: Uri): String {
                  val path = uri.lastPathSegment ?: ""
                  val dot = path.lastIndexOf('.')
                  return if (dot >= 0) path.substring(dot + 1) else ""
              }

              private fun applyExifRotation(bmp: Bitmap, orientation: Int): Bitmap {
                  val m = Matrix()
                  when (orientation) {
                      ExifInterface.ORIENTATION_FLIP_HORIZONTAL -> m.setScale(-1f, 1f)
                      ExifInterface.ORIENTATION_ROTATE_180 -> m.setRotate(180f)
                      ExifInterface.ORIENTATION_FLIP_VERTICAL -> { m.setRotate(180f); m.postScale(-1f, 1f) }
                      ExifInterface.ORIENTATION_TRANSPOSE -> { m.setRotate(90f); m.postScale(-1f, 1f) }
                      ExifInterface.ORIENTATION_ROTATE_90 -> m.setRotate(90f)
                      ExifInterface.ORIENTATION_TRANSVERSE -> { m.setRotate(270f); m.postScale(-1f, 1f) }
                      ExifInterface.ORIENTATION_ROTATE_270 -> m.setRotate(270f)
                      else -> return bmp
                  }
                  val rotated = Bitmap.createBitmap(bmp, 0, 0, bmp.width, bmp.height, m, true)
                  if (rotated != bmp) bmp.recycle()
                  return rotated
              }

              fun prepareCroppedBitmap(src: Bitmap, crop: CropRect, preserveAlpha: Boolean, bgIdx: Int): Bitmap {
                  var current = src
                  if (crop.sx > 0 || crop.sy > 0 || crop.sw != current.width || crop.sh != current.height) {
                      current = Bitmap.createBitmap(current, crop.sx, crop.sy, crop.sw, crop.sh)
                  }
                  if (crop.dw != current.width || crop.dh != current.height) {
                      current = Bitmap.createScaledBitmap(current, crop.dw, crop.dh, true)
                  }
                  val out = Bitmap.createBitmap(crop.dw, crop.dh, Bitmap.Config.ARGB_8888)
                  val canvas = Canvas(out)
                  if (!preserveAlpha) {
                      val bgColor = when (bgIdx) {
                          1 -> Color.BLACK
                          2 -> Color.parseColor("#0F172A")
                          else -> Color.WHITE
                      }
                      canvas.drawColor(bgColor)
                  }
                  val paint = Paint(Paint.ANTI_ALIAS_FLAG or Paint.FILTER_BITMAP_FLAG)
                  canvas.drawBitmap(current, 0f, 0f, paint)
                  return out
              }

              fun applyUnsharpMask(bmp: Bitmap, amount: Double) {
                  val w = bmp.width
                  val h = bmp.height
                  if (w < 3 || h < 3 || amount <= 0.0) return
                  val src = IntArray(w * h)
                  val dst = IntArray(w * h)
                  bmp.getPixels(src, 0, w, 0, 0, w, h)
                  System.arraycopy(src, 0, dst, 0, src.size)

                  for (y in 1 until h - 1) {
                      val row = y * w
                      for (x in 1 until w - 1) {
                          val idx = row + x
                          val c00 = src[(y - 1) * w + (x - 1)]
                          val c01 = src[(y - 1) * w + x]
                          val c02 = src[(y - 1) * w + (x + 1)]
                          val c10 = src[row + (x - 1)]
                          val c11 = src[idx]
                          val c12 = src[row + (x + 1)]
                          val c20 = src[(y + 1) * w + (x - 1)]
                          val c21 = src[(y + 1) * w + x]
                          val c22 = src[(y + 1) * w + (x + 1)]

                          val a = (c11 ushr 24) and 0xFF
                          val r = sharpenChannel(c00, c01, c02, c10, c11, c12, c20, c21, c22, 16, amount)
                          val g = sharpenChannel(c00, c01, c02, c10, c11, c12, c20, c21, c22, 8, amount)
                          val b = sharpenChannel(c00, c01, c02, c10, c11, c12, c20, c21, c22, 0, amount)
                          dst[idx] = (a shl 24) or (r shl 16) or (g shl 8) or b
                      }
                  }
                  bmp.setPixels(dst, 0, w, 0, 0, w, h)
              }

              private fun sharpenChannel(
                  c00: Int, c01: Int, c02: Int,
                  c10: Int, c11: Int, c12: Int,
                  c20: Int, c21: Int, c22: Int,
                  shift: Int, amount: Double
              ): Int {
                  val tl = (c00 ushr shift) and 0xFF
                  val tc = (c01 ushr shift) and 0xFF
                  val tr = (c02 ushr shift) and 0xFF
                  val ml = (c10 ushr shift) and 0xFF
                  val mc = (c11 ushr shift) and 0xFF
                  val mr = (c12 ushr shift) and 0xFF
                  val bl = (c20 ushr shift) and 0xFF
                  val bc = (c21 ushr shift) and 0xFF
                  val br = (c22 ushr shift) and 0xFF
                  val blur = (tl + 2 * tc + tr + 2 * ml + 4 * mc + 2 * mr + bl + 2 * bc + br) * 0.0625
                  val v = Math.round(mc + amount * (mc - blur)).toInt()
                  return v.coerceIn(0, 255)
              }

              fun measureBottomBandBlackRatio(bmp: Bitmap, bottomFraction: Double): Double {
                  val w = bmp.width
                  val h = bmp.height
                  if (w <= 0 || h <= 0) return 0.0
                  val bandH = maxOf(4, Math.round(h * bottomFraction).toInt())
                  val startY = maxOf(0, h - bandH)
                  val rows = h - startY
                  val buf = IntArray(w * rows)
                  bmp.getPixels(buf, 0, w, 0, startY, w, rows)
                  var sampled = 0L
                  var pureBlack = 0L
                  val stepX = maxOf(1, w / 256)
                  for (y in 0 until rows) {
                      val rowOff = y * w
                      var x = 0
                      while (x < w) {
                          val px = buf[rowOff + x]
                          val a = (px ushr 24) and 0xFF
                          val r = (px ushr 16) and 0xFF
                          val g = (px ushr 8) and 0xFF
                          val b = px and 0xFF
                          sampled++
                          if (a > 16 && r <= 3 && g <= 3 && b <= 3) {
                              pureBlack++
                          }
                          x += stepX
                      }
                  }
                  return if (sampled > 0) pureBlack.toDouble() / sampled else 0.0
              }

              fun verifyOutputIntegrity(refCropped: Bitmap, outFile: File, expectedW: Int, expectedH: Int): String? {
                  if (!outFile.exists() || outFile.length() < 64L) {
                      return "File output tidak valid (0 byte / korup)."
                  }
                  val decoded = try {
                      decodeFileNormalized(outFile)
                  } catch (e: Exception) {
                      return "Stream output korup saat verifikasi: ${e.message}"
                  }
                  if (Math.abs(decoded.width - expectedW) > 2 || Math.abs(decoded.height - expectedH) > 2) {
                      return "Dimensi hasil tidak sesuai (${decoded.width}x${decoded.height} vs ${expectedW}x${expectedH})."
                  }
                  val outB15 = measureBottomBandBlackRatio(decoded, 0.15)
                  if (outB15 >= 0.96 && measureBottomBandBlackRatio(refCropped, 0.15) < 0.80) {
                      return "Bagian bawah gambar hasil terdeteksi hitam/korup."
                  }
                  val outB5 = measureBottomBandBlackRatio(decoded, 0.05)
                  if (outB5 >= 0.98 && measureBottomBandBlackRatio(refCropped, 0.05) < 0.75) {
                      return "Tepi bawah gambar hasil terdeteksi hitam/korup."
                  }
                  return null
              }

              fun saveToFinalDestination(
                  tempOutFile: File,
                  desiredBaseName: String,
                  outExt: String,
                  mimeType: String,
                  customTreeUri: Uri?
              ): Pair<Uri, String> {
                  val cleanBase = desiredBaseName.replace(Regex("[\\\\/:*?\"<>|]"), "_").ifEmpty { "image" }
                  if (customTreeUri != null) {
                      val dir = DocumentFile.fromTreeUri(context, customTreeUri)
                      if (dir != null && dir.canWrite()) {
                          var finalName = "$cleanBase.$outExt"
                          var idx = 1
                          while (dir.findFile(finalName) != null) {
                              finalName = "$cleanBase ($idx).$outExt"
                              idx++
                          }
                          val doc = dir.createFile(mimeType, finalName)
                              ?: throw IllegalStateException("Gagal membuat file di folder output SAF.")
                          context.contentResolver.openOutputStream(doc.uri)?.use { out ->
                              FileInputStream(tempOutFile).use { inp -> inp.copyTo(out) }
                          }
                          return Pair(doc.uri, finalName)
                      }
                  }

                  val finalName = "${cleanBase}_${System.currentTimeMillis() % 10000}.$outExt"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      val values = ContentValues().apply {
                          put(MediaStore.MediaColumns.DISPLAY_NAME, finalName)
                          put(MediaStore.MediaColumns.MIME_TYPE, mimeType)
                          put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_PICTURES + "/HyperbitAVIF")
                      }
                      val uri = context.contentResolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, values)
                          ?: throw IllegalStateException("Gagal menyimpan ke MediaStore Pictures/HyperbitAVIF")
                      context.contentResolver.openOutputStream(uri)?.use { out ->
                          FileInputStream(tempOutFile).use { inp -> inp.copyTo(out) }
                      }
                      return Pair(uri, finalName)
                  } else {
                      val pubDir = File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_PICTURES), "HyperbitAVIF")
                      pubDir.mkdirs()
                      val dest = File(pubDir, finalName)
                      tempOutFile.copyTo(dest, overwrite = true)
                      return Pair(Uri.fromFile(dest), finalName)
                  }
              }
          }
