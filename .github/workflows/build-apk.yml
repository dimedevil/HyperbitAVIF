              private void startBatchConversion() {
                  if (isRunning.get()) return;
                  if (queue.isEmpty()) {
                      Toast.makeText(this, "Pilih gambar terlebih dahulu", Toast.LENGTH_SHORT).show();
                      return;
                  }

                  isRunning.set(true);
                  stopRequested.set(false);
                  setControlsEnabled(false);

                  final int threads = getSelectedThreadCount();
                  final int quality = Math.max(10, sbQuality.getProgress());
                  final int formatIdx = spFormat.getSelectedItemPosition();
                  final int scaleIdx = spScale.getSelectedItemPosition();

                  appendLog("[START] Memproses " + queue.size() + " file • Threads: " + threads + " • Q=" + quality);

                  ExecutorService pool = Executors.newFixedThreadPool(threads);
                  final AtomicInteger doneCount = new AtomicInteger(0);
                  final int total = queue.size();

                  for (QueueItem item : queue) {
                      item.status = "Waiting...";
                      pool.submit(() -> {
                          if (stopRequested.get()) {
                              item.status = "Cancelled";
                              uiHandler.post(this::refreshQueueUI);
                              return;
                          }
                          activeWorkers.incrementAndGet();
                          item.status = "Encoding...";
                          uiHandler.post(this::refreshQueueUI);

                          try {
                              processSingleItem(item, formatIdx, quality, scaleIdx);
                          } catch (Throwable t) {
                              item.status = "Error: " + t.getMessage();
                              uiHandler.post(() -> appendLog("[ERR] " + item.originalName + ": " + t.getMessage()));
                          } finally {
                              activeWorkers.decrementAndGet();
                              int completed = doneCount.incrementAndGet();
                              uiHandler.post(() -> {
                                  progressBar.setProgress((completed * 100) / Math.max(1, total));
                                  refreshQueueUI();
                                  if (completed >= total) {
                                      finishBatch(pool);
                                  }
                              });
                          }
                      });
                  }
                  pool.shutdown();
              }

              private void finishBatch(ExecutorService pool) {
                  isRunning.set(false);
                  setControlsEnabled(true);
                  boolean hasSuccess = false;
                  for (QueueItem item : queue) {
                      if (item.encodedData != null && item.encodedData.length > 0) {
                          hasSuccess = true;
                          break;
                      }
                  }
                  btnExportZip.setEnabled(hasSuccess);
                  appendLog("[DONE] Batch selesai.");
              }

              private void processSingleItem(QueueItem item, int formatIdx, int quality, int scaleIdx) throws Exception {
                  Bitmap bmp = decodeSafeBitmap(item.uri);
                  if (bmp == null) throw new IllegalStateException("Gagal decode gambar");

                  bmp = applyScale(bmp, scaleIdx);

                  byte[] outBytes;
                  String ext;
                  String mime;

                  if (formatIdx == 0) {
                      HeifCoder coder = new HeifCoder();
                      outBytes = encodeAvifCompat(coder, bmp, quality);
                      ext = ".avif";
                      mime = "image/avif";
                  } else if (formatIdx == 1) {
                      HeifCoder coder = new HeifCoder();
                      outBytes = coder.encodeHeic(bmp);
                      ext = ".heic";
                      mime = "image/heic";
                  } else if (formatIdx == 2) {
                      ByteArrayOutputStream baos = new ByteArrayOutputStream();
                      bmp.compress(Bitmap.CompressFormat.WEBP, quality, baos);
                      outBytes = baos.toByteArray();
                      ext = ".webp";
                      mime = "image/webp";
                  } else {
                      Bitmap flat = Bitmap.createBitmap(bmp.getWidth(), bmp.getHeight(), Bitmap.Config.ARGB_8888);
                      Canvas c = new Canvas(flat);
                      c.drawColor(Color.WHITE);
                      c.drawBitmap(bmp, 0, 0, null);
                      if (flat != bmp) bmp.recycle();
                      bmp = flat;

                      ByteArrayOutputStream baos = new ByteArrayOutputStream();
                      bmp.compress(Bitmap.CompressFormat.JPEG, quality, baos);
                      outBytes = baos.toByteArray();
                      ext = ".jpg";
                      mime = "image/jpeg";
                  }

                  bmp.recycle();

                  String baseName = item.originalName.replaceFirst("\\.[^.]+$", "");
                  item.outputName = baseName + ext;
                  item.outputBytes = outBytes.length;
                  item.encodedData = outBytes;

                  saveToPictures(item.outputName, mime, outBytes);

                  long savedPct = item.inputBytes > 0
                          ? Math.round((1.0 - ((double) item.outputBytes / item.inputBytes)) * 100.0)
                          : 0;
                  item.status = "OK • " + formatBytes(item.outputBytes) + " (" + (savedPct >= 0 ? "-" + savedPct : "+" + Math.abs(savedPct)) + "%)";
                  uiHandler.post(() -> appendLog("[OK] " + item.outputName + " -> " + formatBytes(item.outputBytes)));
              }

              private byte[] encodeAvifCompat(HeifCoder coder, Bitmap bmp, int quality) throws Exception {
                  for (Method m : HeifCoder.class.getMethods()) {
                      if (m.getName().equals("encodeAvif")) {
                          Class<?>[] pts = m.getParameterTypes();
                          if (pts.length == 2 && pts[0] == Bitmap.class && pts[1] == int.class) {
                              return (byte[]) m.invoke(coder, bmp, quality);
                          }
                      }
                  }
                  return coder.encodeAvif(bmp);
              }

              private Bitmap decodeSafeBitmap(Uri uri) throws Exception {
                  BitmapFactory.Options bounds = new BitmapFactory.Options();
                  bounds.inJustDecodeBounds = true;
                  try (InputStream is = getContentResolver().openInputStream(uri)) {
                      BitmapFactory.decodeStream(is, null, bounds);
                  }

                  int sampleSize = 1;
                  int maxDim = Math.max(bounds.outWidth, bounds.outHeight);
                  while (maxDim / sampleSize > 4096) {
                      sampleSize *= 2;
                  }

                  BitmapFactory.Options opts = new BitmapFactory.Options();
                  opts.inSampleSize = sampleSize;
                  opts.inPreferredConfig = Bitmap.Config.ARGB_8888;
                  Bitmap bmp;
                  try (InputStream is = getContentResolver().openInputStream(uri)) {
                      bmp = BitmapFactory.decodeStream(is, null, opts);
                  }
                  if (bmp == null) return null;

                  int rotation = 0;
                  try (InputStream is = getContentResolver().openInputStream(uri)) {
                      if (is != null) {
                          ExifInterface exif = new ExifInterface(is);
                          int orient = exif.getAttributeInt(ExifInterface.TAG_ORIENTATION, ExifInterface.ORIENTATION_NORMAL);
                          if (orient == ExifInterface.ORIENTATION_ROTATE_90) rotation = 90;
                          else if (orient == ExifInterface.ORIENTATION_ROTATE_180) rotation = 180;
                          else if (orient == ExifInterface.ORIENTATION_ROTATE_270) rotation = 270;
                      }
                  } catch (Exception ignored) {}

                  if (rotation != 0) {
                      Matrix m = new Matrix();
                      m.postRotate(rotation);
                      Bitmap rotated = Bitmap.createBitmap(bmp, 0, 0, bmp.getWidth(), bmp.getHeight(), m, true);
                      if (rotated != bmp) bmp.recycle();
                      bmp = rotated;
                  }
                  return bmp;
              }

              private Bitmap applyScale(Bitmap src, int scaleIdx) {
                  int w = src.getWidth();
                  int h = src.getHeight();
                  int targetW = w;
                  int targetH = h;

                  if (scaleIdx == 1) {
                      targetW = (int) (w * 0.75f);
                      targetH = (int) (h * 0.75f);
                  } else if (scaleIdx == 2) {
                      targetW = (int) (w * 0.50f);
                      targetH = (int) (h * 0.50f);
                  } else if (scaleIdx == 3 && Math.max(w, h) > 2560) {
                      float ratio = 2560f / Math.max(w, h);
                      targetW = Math.round(w * ratio);
                      targetH = Math.round(h * ratio);
                  } else if (scaleIdx == 4 && Math.max(w, h) > 1920) {
                      float ratio = 1920f / Math.max(w, h);
                      targetW = Math.round(w * ratio);
                      targetH = Math.round(h * ratio);
                  } else if (scaleIdx == 5 && Math.max(w, h) > 1280) {
                      float ratio = 1280f / Math.max(w, h);
                      targetW = Math.round(w * ratio);
                      targetH = Math.round(h * ratio);
                  }

                  targetW = Math.max(2, (targetW / 2) * 2);
                  targetH = Math.max(2, (targetH / 2) * 2);

                  if (targetW == w && targetH == h) return src;
                  Bitmap scaled = Bitmap.createScaledBitmap(src, targetW, targetH, true);
                  if (scaled != src) src.recycle();
                  return scaled;
              }

              private void saveToPictures(String fileName, String mime, byte[] data) throws Exception {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      ContentValues values = new ContentValues();
                      values.put(MediaStore.MediaColumns.DISPLAY_NAME, fileName);
                      values.put(MediaStore.MediaColumns.MIME_TYPE, mime);
                      values.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_PICTURES + "/HyperbitAVIF");
                      Uri itemUri = getContentResolver().insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, values);
                      if (itemUri != null) {
                          try (OutputStream os = getContentResolver().openOutputStream(itemUri)) {
                              if (os != null) os.write(data);
                          }
                      }
                  } else {
                      File dir = new File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_PICTURES), "HyperbitAVIF");
                      if (!dir.exists()) dir.mkdirs();
                      File outFile = new File(dir, fileName);
                      try (FileOutputStream fos = new FileOutputStream(outFile)) {
                          fos.write(data);
                      }
                  }
              }

              private void exportCompletedAsZip() {
                  try {
                      String zipName = "HyperbitAVIF_" + new SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(new Date()) + ".zip";
                      ByteArrayOutputStream baos = new ByteArrayOutputStream();
                      Set<String> usedNames = new HashSet<>();
                      try (ZipOutputStream zos = new ZipOutputStream(baos)) {
                          for (QueueItem item : queue) {
                              if (item.encodedData != null && item.encodedData.length > 0) {
                                  String entryName = item.outputName;
                                  int idx = 1;
                                  while (usedNames.contains(entryName)) {
                                      entryName = idx + "_" + item.outputName;
                                      idx++;
                                  }
                                  usedNames.add(entryName);
                                  zos.putNextEntry(new ZipEntry(entryName));
                                  zos.write(item.encodedData);
                                  zos.closeEntry();
                              }
                          }
                      }
                      byte[] zipBytes = baos.toByteArray();

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          ContentValues values = new ContentValues();
                          values.put(MediaStore.MediaColumns.DISPLAY_NAME, zipName);
                          values.put(MediaStore.MediaColumns.MIME_TYPE, "application/zip");
                          values.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                          Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                          if (uri != null) {
                              try (OutputStream os = getContentResolver().openOutputStream(uri)) {
                                  if (os != null) os.write(zipBytes);
                              }
                          }
                      } else {
                          File dl = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                          try (FileOutputStream fos = new FileOutputStream(new File(dl, zipName))) {
                              fos.write(zipBytes);
                          }
                      }
                      appendLog("[ZIP] Tersimpan ke Downloads/" + zipName);
                      Toast.makeText(this, "ZIP tersimpan di Downloads/" + zipName, Toast.LENGTH_LONG).show();
                  } catch (Exception e) {
                      appendLog("[ERR ZIP] " + e.getMessage());
                  }
              }

              private void setControlsEnabled(boolean enabled) {
                  btnPickImages.setEnabled(enabled);
                  btnConvert.setEnabled(enabled);
                  btnClear.setEnabled(enabled);
                  spFormat.setEnabled(enabled);
                  spThreads.setEnabled(enabled);
                  spScale.setEnabled(enabled);
                  spSpeed.setEnabled(enabled);
                  sbQuality.setEnabled(enabled);
                  btnStop.setEnabled(!enabled);
              }

              private void refreshQueueUI() {
                  long totalIn = 0;
                  for (QueueItem q : queue) totalIn += q.inputBytes;
                  tvQueueSummary.setText("Antrean: " + queue.size() + " file • Total Input: " + formatBytes(totalIn));

                  queueContainer.removeAllViews();
                  for (QueueItem item : queue) {
                      LinearLayout row = new LinearLayout(this);
                      row.setOrientation(LinearLayout.VERTICAL);
                      row.setPadding(16, 12, 16, 12);
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                      lp.topMargin = 8;
                      row.setLayoutParams(lp);
                      row.setBackgroundColor(Color.parseColor("#0F172A"));

                      TextView tvName = new TextView(this);
                      tvName.setText(item.originalName + " (" + formatBytes(item.inputBytes) + ")");
                      tvName.setTextColor(Color.parseColor("#F1F5F9"));
                      tvName.setTextSize(12f);

                      TextView tvSt = new TextView(this);
                      tvSt.setText(item.status);
                      tvSt.setTextSize(11f);
                      if (item.status.startsWith("OK")) {
                          tvSt.setTextColor(Color.parseColor("#34D399"));
                      } else if (item.status.startsWith("Error")) {
                          tvSt.setTextColor(Color.parseColor("#F87171"));
                      } else {
                          tvSt.setTextColor(Color.parseColor("#93C5FD"));
                      }

                      row.addView(tvName);
                      row.addView(tvSt);
                      queueContainer.addView(row);
                  }
              }

              private void startTelemetryLoop() {
                  lastCpuTimeMs = Process.getElapsedCpuTime();
                  lastWallTimeMs = SystemClock.elapsedRealtime();

                  uiHandler.postDelayed(new Runnable() {
                      @Override
                      public void run() {
                          long nowCpu = Process.getElapsedCpuTime();
                          long nowWall = SystemClock.elapsedRealtime();
                          long dCpu = Math.max(0, nowCpu - lastCpuTimeMs);
                          long dWall = Math.max(1, nowWall - lastWallTimeMs);
                          lastCpuTimeMs = nowCpu;
                          lastWallTimeMs = nowWall;

                          float cpuPct = Math.min(100f, (dCpu * 100f) / (dWall * cpuCores));
                          int workers = activeWorkers.get();
                          if (workers > 0 && cpuPct < 10f) {
                              cpuPct = Math.min(100f, (workers * 100f) / cpuCores);
                          }
                          cpuGraphView.pushSample(cpuPct);
                          tvCpuStats.setText(String.format(Locale.US, "CPU Load: %.0f%% • Active Workers: %d/%d",
                                  cpuPct, workers, getSelectedThreadCount()));

                          ActivityManager am = (ActivityManager) getSystemService(ACTIVITY_SERVICE);
                          ActivityManager.MemoryInfo mi = new ActivityManager.MemoryInfo();
                          if (am != null) {
                              am.getMemoryInfo(mi);
                              long usedMb = (mi.totalMem - mi.availMem) / (1024 * 1024);
                              long totalMb = mi.totalMem / (1024 * 1024);
                              tvRamStats.setText("RAM: " + usedMb + " / " + totalMb + " MB");
                          }

                          uiHandler.postDelayed(this, 650);
                      }
                  }, 650);
              }

              private void appendLog(String msg) {
                  String current = tvLog.getText().toString();
                  String[] lines = current.split("\n");
                  StringBuilder sb = new StringBuilder();
                  int start = Math.max(0, lines.length - 14);
                  for (int i = start; i < lines.length; i++) {
                      sb.append(lines[i]).append("\n");
                  }
                  sb.append(msg);
                  tvLog.setText(sb.toString());
              }

              private String formatBytes(long bytes) {
                  if (bytes < 1024) return bytes + " B";
                  double kb = bytes / 1024.0;
                  if (kb < 1024) return String.format(Locale.US, "%.1f KB", kb);
                  return String.format(Locale.US, "%.2f MB", kb / 1024.0);
              }
          }
          EOF

      - name: Build & Sign Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Prepare Final APK Artifact
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk release-output/Hyperbit-AVIF.apk
          ls -lh release-output/Hyperbit-AVIF.apk

      - name: Upload Hyperbit-AVIF.apk
        uses: actions/upload-artifact@v4
        with:
          name: Hyperbit-AVIF
          path: release-output/Hyperbit-AVIF.apk
          retention-days: 30
