          cat << 'EOF' > app/src/main/java/com/hyperbit/avif/CpuGraphView.java
          package com.hyperbit.avif;

          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.Path;
          import android.util.AttributeSet;
          import android.view.View;

          import java.util.LinkedList;

          public class CpuGraphView extends View {
              private final Paint gridPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint linePaint = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint fillPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final LinkedList<Float> samples = new LinkedList<>();
              private static final int MAX_SAMPLES = 48;

              public CpuGraphView(Context context, AttributeSet attrs) {
                  super(context, attrs);
                  gridPaint.setColor(Color.parseColor("#1E293B"));
                  gridPaint.setStrokeWidth(2f);

                  linePaint.setColor(Color.parseColor("#10B981"));
                  linePaint.setStrokeWidth(4f);
                  linePaint.setStyle(Paint.Style.STROKE);

                  fillPaint.setColor(Color.parseColor("#2610B981"));
                  fillPaint.setStyle(Paint.Style.FILL);

                  for (int i = 0; i < MAX_SAMPLES; i++) {
                      samples.add(0f);
                  }
              }

              public void pushSample(float pct) {
                  float clamped = Math.max(0f, Math.min(100f, pct));
                  if (samples.size() >= MAX_SAMPLES) {
                      samples.removeFirst();
                  }
                  samples.add(clamped);
                  if (clamped > 80f) {
                      linePaint.setColor(Color.parseColor("#F43F5E"));
                      fillPaint.setColor(Color.parseColor("#26F43F5E"));
                  } else if (clamped > 45f) {
                      linePaint.setColor(Color.parseColor("#6366F1"));
                      fillPaint.setColor(Color.parseColor("#266366F1"));
                  } else {
                      linePaint.setColor(Color.parseColor("#10B981"));
                      fillPaint.setColor(Color.parseColor("#2610B981"));
                  }
                  invalidate();
              }

              @Override
              protected void onDraw(Canvas canvas) {
                  super.onDraw(canvas);
                  float w = getWidth();
                  float h = getHeight();
                  if (w <= 0 || h <= 0) return;

                  canvas.drawColor(Color.parseColor("#0B0F19"));
                  canvas.drawLine(0, h * 0.25f, w, h * 0.25f, gridPaint);
                  canvas.drawLine(0, h * 0.50f, w, h * 0.50f, gridPaint);
                  canvas.drawLine(0, h * 0.75f, w, h * 0.75f, gridPaint);

                  if (samples.size() < 2) return;

                  Path strokePath = new Path();
                  Path areaPath = new Path();
                  float stepX = w / (MAX_SAMPLES - 1);

                  areaPath.moveTo(0, h);
                  int idx = 0;
                  for (Float val : samples) {
                      float x = idx * stepX;
                      float y = h - (val / 100f) * (h - 8f) - 4f;
                      if (idx == 0) {
                          strokePath.moveTo(x, y);
                      } else {
                          strokePath.lineTo(x, y);
                      }
                      areaPath.lineTo(x, y);
                      idx++;
                  }
                  areaPath.lineTo(w, h);
                  areaPath.close();

                  canvas.drawPath(areaPath, fillPaint);
                  canvas.drawPath(strokePath, linePaint);
              }
          }
