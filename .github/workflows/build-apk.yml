              private fun scanFolderTreeAsync(treeUri: Uri) {
                  appendLog("Memindai folder secara async di latar belakang...", "INFO")
                  scope.launch(Dispatchers.IO) {
                      val found = mutableListOf<Uri>()
                      val stack = ArrayDeque<DocumentFile>()
                      DocumentFile.fromTreeUri(this@MainActivity, treeUri)?.let { stack.add(it) }
                      while (stack.isNotEmpty()) {
                          val dir = stack.removeLast()
                          for (child in dir.listFiles()) {
                              if (child.isDirectory) {
                                  stack.add(child)
                              } else if (child.isFile) {
                                  val n = child.name ?: ""
                                  if (AppHelpers.isSupportedImageName(n)) found.add(child.uri)
                              }
                          }
                      }
                      withContext(Dispatchers.Main) {
                          if (found.isEmpty()) appendLog("Tidak ada gambar valid ditemukan di folder tersebut.", "WARN")
                          else enqueueUris(found)
                      }
                  }
              }

              private fun enqueueUris(uris: List<Uri>) {
                  val autoStart = autoConvertCheck.isChecked
                  scope.launch(Dispatchers.IO) {
                      val added = mutableListOf<QueueItem>()
                      for (uri in uris) {
                          try {
                              val name = resolveFileName(uri)
                              val size = resolveFileSize(uri)
                              val ext = name.substringAfterLast('.', "JPG").uppercase(Locale.US)
                              val base = name.substringBeforeLast('.', name)
                              val bmp = engine.decodeNormalizedBitmap(uri)
                              val scale = minOf(1.0, 96.0 / maxOf(1, maxOf(bmp.width, bmp.height)))
                              val thumb = Bitmap.createScaledBitmap(
                                  bmp,
                                  maxOf(1, (bmp.width * scale).toInt()),
                                  maxOf(1, (bmp.height * scale).toInt()),
                                  true
                              )
                              val item = QueueItem(
                                  id = UUID.randomUUID().toString(),
                                  sourceUri = uri,
                                  origName = name,
                                  baseName = base,
                                  origExt = ext,
                                  category = AppHelpers.getSourceCategory(ext),
                                  origSize = size,
                                  origWidth = bmp.width,
                                  origHeight = bmp.height,
                                  thumbnail = thumb
                              )
                              added.add(item)
                          } catch (e: Exception) {
                              withContext(Dispatchers.Main) {
                                  appendLog("Gagal memuat file: ${e.message}", "ERROR")
                              }
                          }
                      }
                      withContext(Dispatchers.Main) {
                          items.addAll(added)
                          updateAllEstimates()
                          refreshQueueViews()
                          updateQueueSummary()
                          appendLog("Berhasil menambahkan ${added.size} file ke antrean.", "INFO")
                          if (autoStart && added.isNotEmpty()) processBatch(added)
                      }
                  }
              }

              private fun startAllItems(reprocess: Boolean) {
                  val targets = items.filter { it.status != "processing" && (reprocess || it.status != "done") }
                  if (targets.isEmpty()) {
                      appendLog("Tidak ada item antrean untuk diproses.", "INFO")
                      return
                  }
                  processBatch(targets)
              }

              private fun processBatch(targets: List<QueueItem>) {
                  val maxCores = maxOf(1, Runtime.getRuntime().availableProcessors())
                  val tIdx = cpuThreadsSpinner.selectedItemPosition
                  val totalBudget = if (tIdx <= 0) maxCores else maxOf(1, maxCores - tIdx)
                  val maxWorkers = if (targets.size <= 1 || totalBudget < 4) 1 else minOf(targets.size, 2)
                  val threadsPerWorker = maxOf(1, totalBudget / maxWorkers)

                  val sem = Semaphore(maxWorkers)
                  for (item in targets) {
                      item.job = scope.launch(Dispatchers.IO) {
                          sem.withPermit {
                              convertSingleItem(item, threadsPerWorker)
                          }
                      }
                  }
              }

              private suspend fun convertSingleItem(item: QueueItem, allocatedThreads: Int) {
                  withContext(Dispatchers.Main) {
                      item.status = "processing"
                      item.progress = 15
                      refreshQueueViews()
                  }
                  activeWorkers.incrementAndGet()
                  val startNs = System.nanoTime()
                  val stagePng = File(cacheDir, "hb_stage_${UUID.randomUUID()}.png")
                  val tempOut = File(cacheDir, "hb_out_${UUID.randomUUID()}")

                  try {
                      val fmtIdx = targetFormatSpinner.selectedItemPosition
                      val quality = qualitySeekBar.progress
                      val lossless = trueLosslessCheck.isChecked
                      val yuvIdx = yuvSpinner.selectedItemPosition
                      val useEffort = cpuEffortCheck.isChecked
                      val effortVal = cpuEffortSpinner.selectedItemPosition
                      val tuneIdx = visualTuneSpinner.selectedItemPosition
                      val sharpIdx = unsharpSpinner.selectedItemPosition
                      val resModeIdx = resModeSpinner.selectedItemPosition
                      val maxPx = maxPixelEdit.text.toString().toIntOrNull()?.coerceAtLeast(50) ?: 850
                      val ratioIdx = aspectRatioSpinner.selectedItemPosition
                      val scalePct = scalePercentEdit.text.toString().toIntOrNull()?.coerceAtLeast(1) ?: 100
                      val custW = customWEdit.text.toString().toIntOrNull()?.coerceAtLeast(10) ?: 1200
                      val custH = customHEdit.text.toString().toIntOrNull()?.coerceAtLeast(10) ?: 800
                      val lockAspect = lockAspectCheck.isChecked
                      val preserveAlpha = preserveAlphaCheck.isChecked
                      val bgIdx = bgColorSpinner.selectedItemPosition
                      val deleteOrig = deleteOriginalCheck.isChecked

                      val decoded = engine.decodeNormalizedBitmap(item.sourceUri)
                      val crop = AppHelpers.calculateCropAndSize(
                          decoded.width, decoded.height, resModeIdx, maxPx, ratioIdx, scalePct, custW, custH, lockAspect
                      )
                      val outExt = when (fmtIdx) {
                          0 -> "avif"
                          1 -> "webp"
                          2 -> "jpg"
                          else -> "png"
                      }
                      val mimeType = when (outExt) {
                          "avif" -> "image/avif"
                          "webp" -> "image/webp"
                          "jpg" -> "image/jpeg"
                          else -> "image/png"
                      }

                      val prepared = engine.prepareCroppedBitmap(decoded, crop, preserveAlpha && outExt != "jpg", bgIdx)
                      val sharpAmount = when (sharpIdx) { 1 -> 0.20; 2 -> 0.35; 3 -> 0.60; else -> 0.0 }
                      if (sharpAmount > 0.0) engine.applyUnsharpMask(prepared, sharpAmount)

                      withContext(Dispatchers.Main) { item.progress = 55; refreshQueueViews() }

                      val finalTempFile = File("${tempOut.absolutePath}.$outExt")
                      when (outExt) {
                          "avif" -> {
                              if (engine.avifEncPath.isEmpty()) throw IllegalStateException("Engine libavifenc.so tidak ditemukan.")
                              FileOutputStream(stagePng).use { prepared.compress(Bitmap.CompressFormat.PNG, 100, it) }
                              val speed = if (useEffort) (10 - effortVal).coerceIn(0, 10) else 4
                              val yuvArg = when (yuvIdx) { 1 -> "422"; 2 -> "444"; else -> "420" }
                              val tuneArg = when (tuneIdx) { 2 -> "psnr"; 1 -> "ssim"; else -> "iq" }
                              val cmd = mutableListOf(
                                  engine.avifEncPath,
                                  "-j", allocatedThreads.toString(),
                                  "--speed", speed.toString()
                              )
                              if (lossless) {
                                  cmd.add("--lossless")
                              } else {
                                  cmd.addAll(listOf("--yuv", yuvArg, "-q", quality.toString(), "--qalpha", quality.toString(), "-a", "tune=$tuneArg"))
                              }
                              cmd.addAll(listOf(stagePng.absolutePath, finalTempFile.absolutePath))
                              val proc = ProcessBuilder(cmd).redirectErrorStream(true).start()
                              item.activeProcess = proc
                              val logOut = proc.inputStream.bufferedReader().readText()
                              val code = proc.waitFor()
                              item.activeProcess = null
                              if (code != 0 || !finalTempFile.exists()) {
                                  throw IllegalStateException("avifenc gagal ($code): $logOut")
                              }
                          }
                          "webp" -> {
                              FileOutputStream(finalTempFile).use {
                                  val fmt = if (Build.VERSION.SDK_INT >= 30) {
                                      if (lossless) Bitmap.CompressFormat.WEBP_LOSSLESS else Bitmap.CompressFormat.WEBP_LOSSY
                                  } else {
                                      @Suppress("DEPRECATION") Bitmap.CompressFormat.WEBP
                                  }
                                  prepared.compress(fmt, if (lossless) 100 else quality, it)
                              }
                          }
                          "jpg" -> {
                              FileOutputStream(finalTempFile).use {
                                  prepared.compress(Bitmap.CompressFormat.JPEG, quality, it)
                              }
                          }
                          else -> {
                              FileOutputStream(finalTempFile).use {
                                  prepared.compress(Bitmap.CompressFormat.PNG, 100, it)
                              }
                          }
                      }

                      withContext(Dispatchers.Main) { item.progress = 88; refreshQueueViews() }

                      // Output Integrity Guard (Anti-Black-Bottom)
                      val verifyErr = engine.verifyOutputIntegrity(prepared, finalTempFile, crop.dw, crop.dh)
                      if (verifyErr != null) {
                          finalTempFile.delete()
                          throw IllegalStateException("$verifyErr (File asli tetap aman & tidak dihapus).")
                      }

                      val saved = engine.saveToFinalDestination(finalTempFile, item.baseName, outExt, mimeType, customOutputTreeUri)
                      val elapsed = (System.nanoTime() - startNs) / 1_000_000_000.0
                      val outSize = finalTempFile.length()
                      finalTempFile.delete()

                      var deletedOrig = false
                      if (deleteOrig) {
                          try {
                              val doc = DocumentFile.fromSingleUri(this@MainActivity, item.sourceUri)
                              if (doc != null && doc.delete()) deletedOrig = true
                          } catch (_: Exception) {}
                      }

                      withContext(Dispatchers.Main) {
                          item.outputUri = saved.first
                          item.outputDisplayName = saved.second
                          item.resultSize = outSize
                          item.resultWidth = crop.dw
                          item.resultHeight = crop.dh
                          item.elapsedSec = elapsed
                          item.progress = 100
                          item.status = "done"
                          refreshQueueViews()
                          updateQueueSummary()
                          val delStr = if (deletedOrig) " [Asli Dihapus]" else ""
                          appendLog(String.format(Locale.US, "Selesai & Terverifikasi: %s (%dx%d) | %s -> %s (%.2f dtk)%s",
                              saved.second, crop.dw, crop.dh, AppHelpers.formatBytes(item.origSize), AppHelpers.formatBytes(outSize), elapsed, delStr), "SUCCESS")
                      }
                  } catch (e: CancellationException) {
                      withContext(Dispatchers.Main) {
                          item.status = "stopped"
                          item.progress = 0
                          refreshQueueViews()
                          updateQueueSummary()
                      }
                  } catch (e: Exception) {
                      withContext(Dispatchers.Main) {
                          item.status = "error"
                          item.statusDetail = e.message ?: "Error"
                          item.progress = 0
                          refreshQueueViews()
                          updateQueueSummary()
                          appendLog("Error ${item.origName}: ${e.message}", "ERROR")
                      }
                  } finally {
                      activeWorkers.decrementAndGet()
                      stagePng.delete()
                  }
              }

              private fun updateAllEstimates() {
                  val fmtIdx = targetFormatSpinner.selectedItemPosition
                  val quality = qualitySeekBar.progress
                  val lossless = trueLosslessCheck.isChecked
                  val yuvIdx = yuvSpinner.selectedItemPosition
                  val resModeIdx = resModeSpinner.selectedItemPosition
                  val maxPx = maxPixelEdit.text.toString().toIntOrNull()?.coerceAtLeast(50) ?: 850
                  val ratioIdx = aspectRatioSpinner.selectedItemPosition
                  val scalePct = scalePercentEdit.text.toString().toIntOrNull()?.coerceAtLeast(1) ?: 100
                  val custW = customWEdit.text.toString().toIntOrNull()?.coerceAtLeast(10) ?: 1200
                  val custH = customHEdit.text.toString().toIntOrNull()?.coerceAtLeast(10) ?: 800
                  val lockAspect = lockAspectCheck.isChecked

                  for (it in items) {
                      val crop = AppHelpers.calculateCropAndSize(it.origWidth, it.origHeight, resModeIdx, maxPx, ratioIdx, scalePct, custW, custH, lockAspect)
                      val px = maxOf(1.0, crop.dw.toDouble() * crop.dh)
                      var bpp = when (fmtIdx) {
                          0 -> if (lossless) 7.5 else 0.08 + 1.85 * Math.pow(quality / 100.0, 2.35)
                          1 -> if (lossless) 7.2 else 0.12 + 2.35 * Math.pow(quality / 100.0, 2.25)
                          2 -> 0.22 + 3.40 * Math.pow(quality / 100.0, 2.15)
                          else -> 8.5
                      }
                      if (fmtIdx == 0 && !lossless) {
                          if (yuvIdx == 1) bpp *= 1.15 else if (yuvIdx == 2) bpp *= 1.32
                      }
                      val estBytes = maxOf(512L, Math.round((px * bpp) / 8.0))
                      val smaller = estBytes <= it.origSize
                      val pct = if (it.origSize > 0) Math.abs((estBytes - it.origSize).toDouble() / it.origSize) * 100.0 else 0.0
                      val trend = if (smaller) String.format(Locale.US, "Kemungkinan Lebih Kecil (-%.0f%%)", pct)
                      else String.format(Locale.US, "Kemungkinan Lebih Besar (+%.0f%%)", pct)
                      it.estimateText = "~Est. ${AppHelpers.formatBytes(estBytes)} | $trend (${crop.dw}x${crop.dh}px)"
                      it.estimateSmaller = smaller
                  }
                  refreshQueueViews()
              }

              private fun refreshQueueViews() {
                  queueContainer.removeAllViews()
                  val filterCats = listOf("ALL", "JPG", "PNG", "WEBP", "HEIC", "OTHER")
                  val activeCat = filterCats.getOrElse(sourceFilterSpinner.selectedItemPosition) { "ALL" }
                  val visible = items.filter { activeCat == "ALL" || it.category == activeCat }

                  for (item in visible) {
                      val rowCard = cardBox("#020617", "#1E293B")
                      val top = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL }
                      val thumbView = ImageView(this).apply {
                          setImageBitmap(item.thumbnail)
                          layoutParams = LinearLayout.LayoutParams(dp(52), dp(52))
                          scaleType = ImageView.ScaleType.CENTER_CROP
                      }
                      top.addView(thumbView)
                      top.addView(spaceW(10))

                      val info = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          layoutParams = LinearLayout.LayoutParams(0, -2, 1f)
                      }
                      val nameEdit = EditText(this).apply {
                          setText(item.baseName)
                          setTextColor(Color.WHITE)
                          textSize = 13f
                          setTypeface(null, Typeface.BOLD)
                          addTextChangedListener(object : TextWatcher {
                              override fun afterTextChanged(s: Editable?) { item.baseName = s?.toString() ?: item.baseName }
                              override fun beforeTextChanged(s: CharSequence?, start: Int, count: Int, after: Int) {}
                              override fun onTextChanged(s: CharSequence?, start: Int, before: Int, count: Int) {}
                          })
                      }
                      info.addView(nameEdit)
                      info.addView(TextView(this).apply {
                          text = item.metaText()
                          textSize = 10.5f
                          typeface = Typeface.MONOSPACE
                          setTextColor(Color.parseColor("#94A3B8"))
                      })
                      if (item.status != "done" && item.estimateText.isNotEmpty()) {
                          info.addView(TextView(this).apply {
                              text = item.estimateText
                              textSize = 10.5f
                              typeface = Typeface.MONOSPACE
                              setTextColor(Color.parseColor(if (item.estimateSmaller) "#38BDF8" else "#FBBF24"))
                          })
                      }
                      info.addView(TextView(this).apply {
                          text = item.statusText()
                          textSize = 11f
                          setTypeface(null, Typeface.BOLD)
                          setTextColor(Color.parseColor(when (item.status) {
                              "processing" -> "#818CF8"
                              "done" -> "#34D399"
                              "stopped" -> "#FBBF24"
                              "error" -> "#FB7185"
                              else -> "#94A3B8"
                          }))
                      })
                      top.addView(info)
                      rowCard.addView(top)

                      val btns = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; setPadding(0, dp(6), 0, 0) }
                      if (item.status == "processing") {
                          btns.addView(actionBtn("Stop", "#E11D48", "#FFFFFF") {
                              item.job?.cancel()
                              item.activeProcess?.destroy()
                          })
                      } else {
                          btns.addView(actionBtn("> Konversi", "#4F46E5", "#FFFFFF") {
                              processBatch(listOf(item))
                          })
                      }
                      if (item.status == "done" && item.outputUri != null) {
                          btns.addView(spaceW(6))
                          btns.addView(actionBtn("Bandingkan", "#1E293B", "#A5B4FC") {
                              showSplitCompareDialog(item)
                          })
                          btns.addView(spaceW(6))
                          btns.addView(actionBtn("Share", "#059669", "#FFFFFF") {
                              shareOutputUri(item.outputUri!!)
                          })
                      }
                      btns.addView(spaceW(6))
                      btns.addView(actionBtn("X", "#1E293B", "#FB7185") {
                          item.job?.cancel()
                          items.remove(item)
                          refreshQueueViews()
                          updateQueueSummary()
                      })
                      rowCard.addView(btns)
                      queueContainer.addView(rowCard)
                      queueContainer.addView(spaceH(8))
                  }
              }

              private fun showSplitCompareDialog(item: QueueItem) {
                  val outUri = item.outputUri ?: return
                  scope.launch(Dispatchers.IO) {
                      try {
                          val beforeBmp = engine.decodeNormalizedBitmap(item.sourceUri)
                          val afterBmp = engine.decodeNormalizedBitmap(outUri)
                          withContext(Dispatchers.Main) {
                              val dialog = Dialog(this@MainActivity, android.R.style.Theme_Black_NoTitleBar_Fullscreen)
                              val root = LinearLayout(this@MainActivity).apply {
                                  orientation = LinearLayout.VERTICAL
                                  setBackgroundColor(Color.parseColor("#020617"))
                                  setPadding(dp(14), dp(14), dp(14), dp(14))
                              }
                              val header = LinearLayout(this@MainActivity).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL }
                              header.addView(TextView(this@MainActivity).apply {
                                  text = "Bandingkan: Asli (${AppHelpers.formatBytes(item.origSize)}) vs Hasil (${AppHelpers.formatBytes(item.resultSize)})"
                                  setTextColor(Color.WHITE)
                                  textSize = 12f
                                  layoutParams = LinearLayout.LayoutParams(0, -2, 1f)
                              })
                              header.addView(actionBtn("Tutup", "#E11D48", "#FFFFFF") { dialog.dismiss() })
                              root.addView(header)

                              val splitView = object : View(this@MainActivity) {
                                  var ratio = 0.5f
                                  val paint = Paint(Paint.FILTER_BITMAP_FLAG)
                                  val linePaint = Paint().apply { color = Color.parseColor("#6366F1"); strokeWidth = 6f }
                                  override fun onTouchEvent(event: MotionEvent): Boolean {
                                      if (width > 0) {
                                          ratio = (event.x / width.toFloat()).coerceIn(0f, 1f)
                                          invalidate()
                                      }
                                      return true
                                  }
                                  override fun onDraw(canvas: Canvas) {
                                      super.onDraw(canvas)
                                      if (width <= 0 || height <= 0) return
                                      val scale = minOf(width.toFloat() / afterBmp.width, height.toFloat() / afterBmp.height)
                                      val dw = afterBmp.width * scale
                                      val dh = afterBmp.height * scale
                                      val left = (width - dw) / 2f
                                      val top = (height - dh) / 2f
                                      val dst = RectF(left, top, left + dw, top + dh)
                                      canvas.drawBitmap(afterBmp, null, dst, paint)
                                      val splitX = left + dw * ratio
                                      canvas.save()
                                      canvas.clipRect(left, top, splitX, top + dh)
                                      canvas.drawBitmap(beforeBmp, null, dst, paint)
                                      canvas.restore()
                                      canvas.drawLine(splitX, top, splitX, top + dh, linePaint)
                                  }
                              }.apply {
                                  layoutParams = LinearLayout.LayoutParams(-1, 0, 1f)
                              }
                              root.addView(splitView)
                              dialog.setContentView(root)
                              dialog.show()
                          }
                      } catch (e: Exception) {
                          withContext(Dispatchers.Main) { appendLog("Gagal membuka Bandingkan: ${e.message}", "ERROR") }
                      }
                  }
              }

              private fun shareOutputUri(uri: Uri) {
                  val send = Intent(Intent.ACTION_SEND).apply {
                      type = "image/*"
                      putExtra(Intent.EXTRA_STREAM, uri)
                      addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                  }
                  startActivity(Intent.createChooser(send, "Bagikan Hasil Konversi"))
              }

              private fun exportAllToZip() {
                  val doneItems = items.filter { it.status == "done" && it.outputUri != null }
                  if (doneItems.isEmpty()) {
                      appendLog("Belum ada file selesai untuk diekspor ke .ZIP.", "WARN")
                      return
                  }
                  scope.launch(Dispatchers.IO) {
                      val zipFile = File(cacheDir, "Hyperbit_AVIF_Batch_${System.currentTimeMillis()}.zip")
                      java.util.zip.ZipOutputStream(FileOutputStream(zipFile)).use { zos ->
                          val used = mutableSetOf<String>()
                          for (it in doneItems) {
                              var name = it.outputDisplayName.ifEmpty { "${it.baseName}.avif" }
                              var c = 1
                              while (used.contains(name)) {
                                  name = "${name.substringBeforeLast('.')}_$c.${name.substringAfterLast('.')}"
                                  c++
                              }
                              used.add(name)
                              zos.putNextEntry(java.util.zip.ZipEntry(name))
                              contentResolver.openInputStream(it.outputUri!!)?.use { inp -> inp.copyTo(zos) }
                              zos.closeEntry()
                          }
                      }
                      withContext(Dispatchers.Main) {
                          val uri = FileProvider.getUriForFile(this@MainActivity, "$packageName.fileprovider", zipFile)
                          val share = Intent(Intent.ACTION_SEND).apply {
                              type = "application/zip"
                              putExtra(Intent.EXTRA_STREAM, uri)
                              addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                          }
                          startActivity(Intent.createChooser(share, "Simpan / Bagikan Arsip .ZIP"))
                          appendLog("Berhasil mengemas ${doneItems.size} file ke arsip .ZIP.", "SUCCESS")
                      }
                  }
              }

              private fun initSystemMonitor() {
                  val cores = maxOf(1, Runtime.getRuntime().availableProcessors())
                  prevCoreTotals = LongArray(cores)
                  prevCoreIdles = LongArray(cores)

                  val tick = object : Runnable {
                      override fun run() {
                          updateCpuAndRam()
                          monitorHandler.postDelayed(this, 650)
                      }
                  }
                  monitorHandler.post(tick)
              }

              private fun updateCpuAndRam() {
                  var sumPct = 0
                  try {
                      RandomAccessFile("/proc/stat", "r").use { raf ->
                          var line: String?
                          while (raf.readLine().also { line = it } != null) {
                              val l = line ?: continue
                              if (l.startsWith("cpu") && l.length > 3 && l[3].isDigit()) {
                                  val parts = l.trim().split(Regex("\\s+"))
                                  val idx = parts[0].removePrefix("cpu").toIntOrNull() ?: continue
                                  if (idx in prevCoreTotals.indices && parts.size >= 5) {
                                      val user = parts[1].toLong()
                                      val nice = parts[2].toLong()
                                      val sys = parts[3].toLong()
                                      val idle = parts[4].toLong()
                                      val total = user + nice + sys + idle
                                      val diffTotal = total - prevCoreTotals[idx]
                                      val diffIdle = idle - prevCoreIdles[idx]
                                      val pct = if (diffTotal > 0) (((diffTotal - diffIdle) * 100.0) / diffTotal).toInt().coerceIn(0, 100) else 0
                                      prevCoreTotals[idx] = total
                                      prevCoreIdles[idx] = idle
                                      sumPct += pct
                                      corePctTexts[idx].text = "C$idx\n$pct%"
                                      coreSparkBars[idx].progress = pct
                                  }
                              }
                          }
                      }
                  } catch (_: Exception) {}

                  val avg = if (prevCoreTotals.isNotEmpty()) sumPct / prevCoreTotals.size else 0
                  val w = activeWorkers.get()
                  cpuSummaryText.text = "Total CPU: $avg% | ${if (w > 0) "Aktif ($w Worker Encoding)" else "Idle (0 Active Workers)"}"

                  val am = getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                  val mi = ActivityManager.MemoryInfo()
                  am.getMemoryInfo(mi)
                  val totalGb = mi.totalMem / (1024.0 * 1024.0 * 1024.0)
                  val usedGb = (mi.totalMem - mi.availMem) / (1024.0 * 1024.0 * 1024.0)
                  val ramPct = if (mi.totalMem > 0) (((mi.totalMem - mi.availMem) * 100.0) / mi.totalMem).toInt() else 0
                  val appMb = (Runtime.getRuntime().totalMemory() - Runtime.getRuntime().freeMemory()) / (1024.0 * 1024.0)
                  ramProgressBar.progress = ramPct
                  ramMonitorText.text = String.format(Locale.US, "Memori App: %.1f MB | RAM Android: %.1f GB / %.1f GB (%d%%)",
                      appMb, usedGb, totalGb, ramPct)
              }

              private fun updateQueueSummary() {
                  queueHeaderText.text = "Antrean Konversi & Hasil (${items.size} file)"
                  if (items.isEmpty()) {
                      totalProgressBar.progress = 0
                      totalProgressText.text = "0%"
                      return
                  }
                  val avg = items.map { if (it.status == "done") 100 else it.progress }.average().toInt()
                  totalProgressBar.progress = avg
                  totalProgressText.text = "$avg%"
              }

              private fun resolveFileName(uri: Uri): String {
                  contentResolver.query(uri, null, null, null, null)?.use { c ->
                      val idx = c.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                      if (idx >= 0 && c.moveToFirst()) return c.getString(idx)
                  }
                  return uri.lastPathSegment ?: "image.jpg"
              }

              private fun resolveFileSize(uri: Uri): Long {
                  contentResolver.query(uri, null, null, null, null)?.use { c ->
                      val idx = c.getColumnIndex(OpenableColumns.SIZE)
                      if (idx >= 0 && c.moveToFirst()) return c.getLong(idx)
                  }
                  return 0L
              }

              private fun appendLog(msg: String, level: String) {
                  val ts = SimpleDateFormat("HH:mm:ss", Locale.US).format(Date())
                  logLines.add("[$ts] [$level] $msg")
                  if (logLines.size > 120) logLines.removeAt(0)
                  logTextView.text = logLines.joinToString("\n")
              }

              private fun cardBox(bgHex: String, strokeHex: String): LinearLayout {
                  return LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(12), dp(12), dp(12), dp(12))
                      background = android.graphics.drawable.GradientDrawable().apply {
                          setColor(Color.parseColor(bgHex))
                          setStroke(dp(1), Color.parseColor(strokeHex))
                          cornerRadius = dp(14).toFloat()
                      }
                  }
              }

              private fun sectionTitle(txt: String): TextView = TextView(this).apply {
                  text = txt
                  textSize = 14f
                  setTypeface(null, Typeface.BOLD)
                  setTextColor(Color.WHITE)
                  setPadding(0, 0, 0, dp(6))
              }

              private fun fieldLabel(txt: String): TextView = TextView(this).apply {
                  text = txt
                  textSize = 11.5f
                  setTypeface(null, Typeface.BOLD)
                  setTextColor(Color.parseColor("#CBD5E1"))
                  setPadding(0, dp(6), 0, dp(3))
              }

              private fun actionBtn(txt: String, bgHex: String, fgHex: String, onClick: () -> Unit): Button {
                  return Button(this).apply {
                      text = txt
                      textSize = 11f
                      isAllCaps = false
                      setTextColor(Color.parseColor(fgHex))
                      background = android.graphics.drawable.GradientDrawable().apply {
                          setColor(Color.parseColor(bgHex))
                          cornerRadius = dp(10).toFloat()
                      }
                      setPadding(dp(10), dp(4), dp(10), dp(4))
                      setOnClickListener { onClick() }
                  }
              }

              private fun darkSpinner(options: List<String>): Spinner {
                  return Spinner(this).apply {
                      adapter = ArrayAdapter(this@MainActivity, android.R.layout.simple_spinner_dropdown_item, options)
                      setBackgroundColor(Color.parseColor("#1E293B"))
                  }
              }

              private fun darkEditText(initial: String, onChanged: () -> Unit): EditText {
                  return EditText(this).apply {
                      setText(initial)
                      inputType = InputType.TYPE_CLASS_NUMBER
                      setTextColor(Color.parseColor("#818CF8"))
                      setBackgroundColor(Color.parseColor("#1E293B"))
                      textSize = 12f
                      setPadding(dp(8), dp(6), dp(8), dp(6))
                      addTextChangedListener(object : TextWatcher {
                          override fun afterTextChanged(s: Editable?) { onChanged() }
                          override fun beforeTextChanged(s: CharSequence?, start: Int, count: Int, after: Int) {}
                          override fun onTextChanged(s: CharSequence?, start: Int, before: Int, count: Int) {}
                      })
                  }
              }

              private fun simpleSelectListener(onSelect: () -> Unit) = object : AdapterView.OnItemSelectedListener {
                  override fun onItemSelected(p: AdapterView<*>?, v: View?, pos: Int, id: Long) { onSelect() }
                  override fun onNothingSelected(p: AdapterView<*>?) {}
              }

              private fun spaceW(dpVal: Int) = Space(this).apply { layoutParams = LinearLayout.LayoutParams(dp(dpVal), 1) }
              private fun spaceH(dpVal: Int) = Space(this).apply { layoutParams = LinearLayout.LayoutParams(1, dp(dpVal)) }
              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()
          }
          EOF

      - name: Initialize Gradle Wrapper & Build Android APK
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Compiled Hyperbit-AVIF Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hyperbit-AVIF-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
  
